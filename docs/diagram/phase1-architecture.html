<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phase 1 架構圖</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif+TC:wght@400&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Single-look editorial diagram page (diagram-design default skin): paper, ink, one accent. */
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #bf4520;
    --color-rule: rgba(45,49,66,0.12);
    --font-sans: 'Geist', 'Noto Sans TC', system-ui, sans-serif;
    --font-serif: 'Instrument Serif', 'Noto Serif TC', serif;
    --font-mono: 'Geist Mono', ui-monospace, monospace;
    color-scheme: light;
  }
  body { margin: 0; background: var(--color-paper); color: var(--color-ink); font-family: var(--font-sans);
    padding-block: 3rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .frame { max-width: 1200px; width: 100%; margin: 0 auto; }
  .diagram-container { width: 100%; overflow-x: auto; }
  .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin: 0 0 0.5rem; }
  h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.2; margin: 0 0 1.5rem; text-wrap: balance; }
  svg { width: 100%; min-width: 1000px; display: block; }
  .cards { display: grid; grid-template-columns: 1.1fr 1fr 0.9fr; gap: 12px; margin-top: 1.5rem; }
  .cards > div { min-width: 0; background: #fff; border: 1px solid var(--color-rule); border-radius: 6px; padding: 14px 16px; }
  .cards h2 { font-size: 0.85rem; font-weight: 600; margin: 0 0 4px; }
  .cards p { margin: 0; font-size: 0.8rem; line-height: 1.6; color: var(--color-muted); }
  code { font-family: var(--font-mono); font-size: 0.85em; }
  @media (max-width: 760px) { .cards { grid-template-columns: 1fr; } }
  @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Architecture · Phase 1 Infra and Contracts</p>
  <h1>Phase 1 架構:兩個 broker、一次性 init、共用訊息契約</h1>

  <div class="diagram-container">
    <svg viewBox="0 0 1000 604" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="phase1-title phase1-desc">
      <title id="phase1-title">Phase 1 infrastructure</title>
      <desc id="phase1-desc">A one-shot init container creates Kafka topics and RabbitMQ queues once both brokers are healthy, while the shared pizza.common package defines the contract later services import.</desc>

        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>

      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Zone: Compose network -->

      <rect x="520" y="100" width="168" height="12" rx="2" fill="#f5f5f5"/>
      <text x="604" y="109" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DOCKER COMPOSE · 127.0.0.1 ONLY</text>

      <path d="M 168,260 H 196 Q 204,260 204,268 V 340 Q 204,348 212,348 H 264" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- Developer -> RabbitMQ management (dashed, passive browsing) -->
      <path d="M 104,212 V 72 Q 104,64 112,64 H 828 Q 836,64 836,72 V 132" fill="none" stroke="#2e5aa8" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-link)"/>
      <!-- Kafka UI -> Kafka -->
      <line x1="344" y1="316" x2="344" y2="212" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <path d="M 528,316 V 180 Q 528,172 520,172 H 496" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <path d="M 672,316 V 180 Q 672,172 680,172 H 720" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <line x1="600" y1="472" x2="600" y2="396" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- Phase 2+ -> contract -->
      <line x1="760" y1="504" x2="712" y2="504" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="122" y="190" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="152" y="199" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HOST :9094</text>
      <rect x="150" y="294" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="174" y="303" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WEB UI</text>
      <rect x="440" y="46" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="478" y="55" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MGMT :15672</text>
      <rect x="350" y="258" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="370" y="267" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">READS</text>
      <rect x="534" y="254" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="562" y="263" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">4 TOPICS</text>
      <rect x="606" y="254" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="636" y="263" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">25 QUEUES</text>
      <rect x="606" y="448" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="628" y="457" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IMPORT</text>
      <rect x="716" y="484" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="736" y="493" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USES</text>

      <!-- Node: Developer (external) -->
      <rect x="40" y="212" width="128" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="212" width="128" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
      <rect x="48" y="220" width="28" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
      <text x="62" y="229" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="104" y="252" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Developer</text>
      <text x="104" y="268" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">browser · pytest</text>

      <!-- Node: Kafka (store) -->
      <rect x="264" y="132" width="232" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="264" y="132" width="232" height="80" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="272" y="140" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="286" y="149" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MSG</text>
      <text x="380" y="176" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Kafka · facts</text>
      <text x="380" y="192" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">station.events (3 partitions)</text>
      <text x="380" y="204" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">kafka:9092 inside</text>

      <!-- Node: RabbitMQ (store) -->
      <rect x="720" y="132" width="232" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="720" y="132" width="232" height="80" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="728" y="140" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="742" y="149" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MQ</text>
      <text x="836" y="176" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">RabbitMQ · commands</text>
      <text x="836" y="192" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">5 exchanges · 25 quorum queues</text>
      <text x="836" y="204" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">retry TTL 5s → dispatch.dlq</text>

      <!-- Node: Kafka UI (backend) -->
      <rect x="264" y="316" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="264" y="316" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="272" y="324" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="286" y="333" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
      <text x="344" y="352" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Kafka UI</text>
      <text x="344" y="368" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">kafbat v1.5.0 · :8080</text>

      <!-- Node: init (focal) -->
      <rect x="488" y="316" width="224" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="488" y="316" width="224" height="80" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
      <rect x="496" y="324" width="32" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
      <text x="512" y="333" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ONCE</text>
      <text x="600" y="360" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">init · bootstrap</text>
      <text x="600" y="376" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">idempotent · exit 0</text>
      <text x="600" y="388" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">never deletes</text>

      <text x="264" y="424" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">init starts after kafka + rabbitmq: service_healthy</text>

      <!-- Node: pizza.common (backend) -->
      <rect x="488" y="472" width="224" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="488" y="472" width="224" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="496" y="480" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="510" y="489" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LIB</text>
      <text x="600" y="508" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">pizza.common</text>
      <text x="600" y="524" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">envelope · topology · *_io</text>

      <!-- Node: Phase 2+ (optional, not built) -->
      <rect x="760" y="472" width="192" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="760" y="472" width="192" height="64" rx="6" fill="transparent" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="768" y="480" width="32" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="784" y="489" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NEXT</text>
      <text x="856" y="508" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Phase 2+ services</text>
      <text x="856" y="524" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">station · scheduler · KPI</text>

      <!-- Annotation -->
      <text x="40" y="504" fill="#2d3142" font-size="17" font-style="italic" font-family="'Instrument Serif', 'Noto Serif TC', serif">RabbitMQ 傳指令,</text>
      <text x="40" y="526" fill="#bf4520" font-size="17" font-style="italic" font-family="'Instrument Serif', 'Noto Serif TC', serif">Kafka 傳事實。</text>

      <!-- Legend strip -->
      <line x1="40" y1="560" x2="960" y2="560" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="576" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
      <rect x="40" y="588" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
      <text x="60" y="596" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal / bootstrap</text>
      <rect x="180" y="588" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="200" y="596" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Service / library</text>
      <rect x="320" y="588" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="340" y="596" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Broker</text>
      <rect x="416" y="588" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
      <text x="436" y="596" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">External</text>
      <line x1="520" y1="594" x2="548" y2="594" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="556" y="596" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Developer access</text>
      <line x1="680" y1="594" x2="708" y2="594" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="716" y="596" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Creates topology</text>
      <line x1="820" y1="594" x2="848" y2="594" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="856" y="596" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Passive / not built</text>
    </svg>
  </div>

  <div class="cards">
    <div><h2>冪等啟動</h2><p>重跑 <code>docker compose up</code> 不新增、不報錯。拓樸漂移時 init 只提示 <code>docker compose down -v</code>,不自動刪除。</p></div>
    <div><h2>訊息契約</h2><p>每則訊息都帶 <code>event_id · run_id · line_id · machine_id · ts · schema_version</code>,缺欄位即拒收。</p></div>
    <div><h2>無效訊息</h2><p>RabbitMQ 端送進 dlx 並 ack;Kafka 端記錄後跳過。</p></div>
  </div>
</div>
</body>
</html>
