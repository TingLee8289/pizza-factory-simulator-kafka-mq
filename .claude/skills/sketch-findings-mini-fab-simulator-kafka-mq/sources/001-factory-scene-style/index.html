<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sketch 001 · Factory scene style</title>
<link id="theme-link" rel="stylesheet" href="../themes/default.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: var(--font-sans); color: var(--color-text); background: var(--color-bg); padding-top: 44px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button, input { transition: all .15s ease; }

  /* ---------- variant tab bar (sketch chrome) ---------- */
  #variant-nav { position: fixed; top: 0; left: 0; right: 0; height: 44px; z-index: 9998; display: flex; align-items: center; gap: 8px; padding: 0 12px;
    background: #fff; border-bottom: 1px solid #e5e5e5; font-family: system-ui, sans-serif; color: #1a1a1a; }
  #variant-nav .ttl { font-size: 12px; color: #666; margin-right: 8px; }
  .variant-tab { border: 1px solid #d4d4d4; background: #fafafa; border-radius: 8px; padding: 6px 12px; font-size: 13px; color: #1a1a1a; }
  .variant-tab:hover { background: #eee; }
  .variant-tab.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }

  /* ---------- stage ---------- */
  #stage { position: relative; height: calc(100vh - 44px); width: 100%; margin: 0 auto; overflow: hidden; background: var(--color-bg); }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .lbl { position: absolute; transform: translate(-50%, -100%); white-space: nowrap; display: flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 650; padding: 3px 8px; border-radius: var(--radius-full);
    background: var(--color-surface-solid); border: var(--border-width) solid var(--color-border); color: var(--color-text); box-shadow: var(--shadow-md); }
  .lbl i { width: 8px; height: 8px; border-radius: 50%; background: var(--color-text-muted); display: inline-block; }
  .lbl.busy i { background: var(--color-success); }
  .lbl.down i { background: var(--color-danger); }
  .lbl .q { font-family: var(--font-num); font-size: 10px; padding: 1px 6px; border-radius: var(--radius-full); background: var(--color-primary); color: var(--color-primary-ink); }
  .lbl .q.zero { display: none; }
  .lbl.sel { outline: 2px solid var(--color-primary); }
  .lbl.hot .q { background: var(--color-danger); color: #fff; }

  /* ---------- HUD ---------- */
  #hud { position: absolute; inset: 0; pointer-events: none; }
  .panel { pointer-events: auto; background: var(--color-surface); border: var(--border-width) solid var(--color-border); border-radius: var(--radius-md);
    box-shadow: var(--shadow-md); backdrop-filter: blur(var(--blur)); -webkit-backdrop-filter: blur(var(--blur)); }
  small, .muted { color: var(--color-text-muted); }
  .num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

  #topbar { position: absolute; top: 12px; left: 12px; right: 12px; height: 52px; display: flex; align-items: center; gap: 14px; padding: 0 14px; }
  .brand { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .brand .logo { font-size: 22px; }
  .brand b { font-size: 1.05rem; font-weight: var(--title-weight); text-transform: var(--title-transform); letter-spacing: .01em; }
  .brand small { display: block; font-size: var(--text-xs); line-height: 1; }
  .search { flex: 0 1 220px; min-width: 120px; }
  .search input { width: 100%; height: 34px; padding: 0 12px; border-radius: var(--radius-full); border: var(--border-width) solid var(--color-border);
    background: transparent; color: var(--color-text); font: inherit; font-size: var(--text-sm); outline: none; }
  .search input:focus { border-color: var(--color-primary); }
  #controls { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .seg { display: inline-flex; border: var(--border-width) solid var(--color-border); border-radius: var(--radius-full); overflow: hidden; }
  .seg button { border: 0; background: transparent; padding: 5px 11px; font-size: var(--text-sm); font-weight: 650; color: var(--color-text-muted); }
  .seg button:hover { color: var(--color-text); background: rgba(127,127,127,.12); }
  .seg button.on { background: var(--color-primary); color: var(--color-primary-ink); }
  .slider { display: flex; align-items: center; gap: 6px; font-size: var(--text-sm); color: var(--color-text-muted); white-space: nowrap; }
  .slider input { width: 90px; accent-color: var(--color-primary); }
  .slider b { font-family: var(--font-num); color: var(--color-text); min-width: 32px; }
  .btn { border: var(--border-width) solid var(--color-border); background: var(--color-surface-solid); border-radius: var(--radius-full); padding: 6px 13px; font-size: var(--text-sm); font-weight: 700; }
  .btn:hover { border-color: var(--color-primary); color: var(--color-primary); }
  .btn.primary { background: var(--color-primary); color: var(--color-primary-ink); border-color: var(--color-primary); }
  .btn.primary:hover { filter: brightness(1.08); color: var(--color-primary-ink); }
  .btn.danger { color: var(--color-danger); }
  .btn:active { transform: translateY(1px); }
  .live { display: flex; align-items: center; gap: 6px; font-size: var(--text-sm); font-weight: 650; padding: 5px 10px; border-radius: var(--radius-full); background: rgba(18,164,106,.12); color: var(--color-success); white-space: nowrap; }
  .live i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: pulse 1.4s infinite; }
  .live b { font-family: var(--font-num); color: var(--color-text); }
  @keyframes pulse { 50% { opacity: .25; } }
  #score { display: none; }

  #kpis { position: absolute; top: 76px; left: 12px; display: flex; gap: 10px; pointer-events: none; }
  .kpi { pointer-events: auto; display: flex; align-items: center; gap: 10px; min-width: 150px; padding: 10px 14px; background: var(--color-surface);
    border: var(--border-width) solid var(--color-border); border-radius: var(--radius-md); box-shadow: var(--shadow-md); backdrop-filter: blur(var(--blur)); }
  .kpi .ic { width: 34px; height: 34px; border-radius: var(--radius-sm); display: grid; place-items: center; font-size: 18px; background: rgba(127,127,127,.14); }
  .kpi small { display: block; font-size: var(--text-xs); }
  .kpi b { font-family: var(--font-num); font-size: 1.35rem; font-weight: 700; line-height: 1.1; }
  .kpi em { font-style: normal; font-size: var(--text-xs); color: var(--color-text-muted); margin-left: 3px; }
  .kpi.alert b { color: var(--color-danger); }
  #little { position: absolute; top: 140px; left: 12px; pointer-events: auto; font-size: var(--text-xs); padding: 6px 10px; border-radius: var(--radius-full);
    background: var(--color-surface); border: var(--border-width) solid var(--color-border); box-shadow: var(--shadow-md); color: var(--color-text-muted); white-space: nowrap; }
  #little b { font-family: var(--font-num); color: var(--color-text); }
  #little .ok { color: var(--color-success); font-weight: 700; }
  #little .bad { color: var(--color-warn); font-weight: 700; }

  #tools { position: absolute; top: 76px; right: 12px; display: flex; flex-direction: column; padding: 4px; gap: 2px; }
  #tools button { width: 34px; height: 34px; border: 0; background: transparent; border-radius: var(--radius-sm); font-size: 16px; color: var(--color-text); }
  #tools button:hover { background: rgba(127,127,127,.16); color: var(--color-primary); }

  #detail { position: absolute; top: 76px; right: 64px; width: 320px; padding: 14px 16px; }
  #detail .hd { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  #detail .hd .ic { width: 40px; height: 40px; border-radius: var(--radius-sm); display: grid; place-items: center; font-size: 22px; background: rgba(127,127,127,.14); }
  #detail .hd small { display: block; font-size: var(--text-xs); letter-spacing: .06em; text-transform: uppercase; }
  #detail .hd b { font-size: 1.1rem; font-weight: var(--title-weight); }
  #detail .hd .x { margin-left: auto; border: 0; background: transparent; font-size: 16px; color: var(--color-text-muted); }
  .chip { display: inline-block; font-size: var(--text-xs); font-weight: 700; padding: 2px 9px; border-radius: var(--radius-full); background: rgba(127,127,127,.16); }
  .chip.busy { background: rgba(18,164,106,.16); color: var(--color-success); }
  .chip.idle { background: rgba(127,127,127,.18); color: var(--color-text-muted); }
  .chip.down { background: rgba(229,72,77,.16); color: var(--color-danger); }
  .chip.warn { background: rgba(224,138,0,.18); color: var(--color-warn); }
  .bar { height: 7px; border-radius: var(--radius-full); background: rgba(127,127,127,.2); overflow: hidden; margin: 8px 0 12px; }
  .bar > i { display: block; height: 100%; background: var(--color-primary); border-radius: inherit; transition: width .3s; box-shadow: var(--glow); }
  .rows > div { display: flex; justify-content: space-between; padding: 5px 0; font-size: var(--text-sm); border-top: 1px solid var(--color-border); }
  .rows > div span:first-child { color: var(--color-text-muted); }
  .rows > div span:last-child { font-family: var(--font-num); font-weight: 650; }
  #detail .acts { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

  #stepper { position: absolute; bottom: 12px; left: 12px; width: 440px; padding: 12px 16px 14px; }
  #stepper h4, #lists h4 { font-size: var(--text-sm); font-weight: var(--title-weight); text-transform: var(--title-transform); margin-bottom: 10px; display: flex; gap: 8px; align-items: center; }
  #stepper h4 small { margin-left: auto; font-family: var(--font-num); }
  .steps { display: flex; align-items: flex-start; }
  .step { flex: 1; text-align: center; position: relative; font-size: 10px; color: var(--color-text-muted); }
  .step::before { content: ''; position: absolute; top: 11px; left: -50%; width: 100%; height: 2px; background: rgba(127,127,127,.3); }
  .step:first-child::before { display: none; }
  .step.done::before, .step.active::before { background: var(--color-primary); }
  .step .dot { position: relative; z-index: 1; width: 24px; height: 24px; margin: 0 auto 4px; border-radius: 50%; display: grid; place-items: center;
    background: var(--color-surface-solid); border: 2px solid rgba(127,127,127,.4); font-size: 11px; }
  .step.done .dot { background: var(--color-primary); border-color: var(--color-primary); color: var(--color-primary-ink); }
  .step.active .dot { border-color: var(--color-primary); box-shadow: 0 0 0 4px rgba(127,127,127,.18), var(--glow); color: var(--color-primary); }
  .step b { display: block; font-size: 10px; color: var(--color-text); font-weight: 650; }
  .step i { display: block; font-style: normal; font-family: var(--font-num); }

  #lists { position: absolute; bottom: 12px; right: 12px; width: 360px; padding: 12px 14px; }
  .tabs { display: flex; gap: 4px; margin-bottom: 8px; }
  .tabs button { border: 0; background: transparent; padding: 4px 10px; border-radius: var(--radius-full); font-size: var(--text-sm); font-weight: 650; color: var(--color-text-muted); }
  .tabs button.on { background: var(--color-primary); color: var(--color-primary-ink); }
  .tabs small { margin-left: auto; align-self: center; }
  .list { max-height: 150px; overflow: auto; }
  .list .row { display: grid; grid-template-columns: 74px 1fr 64px; gap: 8px; align-items: center; padding: 6px 4px; border-top: 1px solid var(--color-border); font-size: var(--text-sm); cursor: pointer; }
  .list .row:hover { background: rgba(127,127,127,.12); }
  .list .row.sel { background: rgba(127,127,127,.18); }
  .list .row b { font-weight: 700; }
  .list .row .mid { display: flex; align-items: center; gap: 8px; color: var(--color-text-muted); font-size: var(--text-xs); }
  .list .row .mid .bar { flex: 1; margin: 0; height: 5px; }
  .list .empty { padding: 14px; text-align: center; color: var(--color-text-muted); font-size: var(--text-sm); }

  #feed { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); width: 300px; padding: 8px 12px; pointer-events: none; font-family: var(--font-num); font-size: 10.5px; line-height: 1.55; }
  #feed div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--color-text-muted); }
  #feed div:first-child { color: var(--color-text); }
  #feed b { color: var(--color-primary); font-weight: 600; }
  #feed h5 { font-family: var(--font-sans); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--color-text-muted); margin-bottom: 2px; }

  #toast { position: absolute; top: 150px; left: 50%; transform: translate(-50%, -10px); opacity: 0; pointer-events: none; padding: 8px 16px;
    border-radius: var(--radius-full); background: var(--color-text); color: var(--color-bg); font-size: var(--text-sm); font-weight: 700; transition: all .25s; z-index: 5; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- Variant B tweaks: control room ---------- */
  body.vb #kpis { flex-direction: column; gap: 8px; }
  body.vb .kpi { min-width: 190px; border-left: 3px solid var(--color-primary); }
  body.vb #little { top: 366px; }
  body.vb .kpi .ic { background: transparent; border: 1px solid var(--color-border); }
  body.vb .brand b { letter-spacing: .14em; }
  body.vb .panel, body.vb .kpi { background-image: linear-gradient(180deg, rgba(34,229,255,.05), transparent 40%); }
  body.vb .lbl { font-family: var(--font-num); text-transform: uppercase; letter-spacing: .06em; border-radius: 2px; }
  body.vb .lbl .q { border-radius: 2px; }
  body.vb .btn, body.vb .seg, body.vb .search input, body.vb .tabs button, body.vb .chip, body.vb .live { border-radius: 2px; }
  body.vb .seg button.on, body.vb .tabs button.on { box-shadow: var(--glow); }
  body.vb .live { background: rgba(61,255,168,.1); }

  /* ---------- Variant C tweaks: pizza kitchen game ---------- */
  body.vc .panel, body.vc .kpi, body.vc #little { backdrop-filter: none; -webkit-backdrop-filter: none; }
  body.vc #topbar { height: 56px; }
  body.vc .brand b { font-size: 1.2rem; color: var(--color-primary); }
  body.vc #score { display: block; font-weight: 800; padding: 6px 14px; border-radius: var(--radius-full); background: var(--color-accent); color: #4a2a12; border: var(--border-width) solid var(--color-border); white-space: nowrap; }
  body.vc #score small { color: #4a2a12; opacity: .8; }
  body.vc #kpis { left: 50%; transform: translateX(-50%); top: 82px; }
  body.vc #kpis { gap: 8px; }
  body.vc .kpi { min-width: 0; padding: 6px 12px; border-radius: var(--radius-full); gap: 8px; }
  body.vc .kpi em { display: none; }
  body.vc #k-bn em { display: inline; }
  body.vc .kpi .ic { background: var(--color-accent); border: 2px solid var(--color-border); width: 32px; height: 32px; }
  body.vc .kpi b { font-size: 1.1rem; }
  body.vc #little { top: 140px; left: 50%; transform: translateX(-50%); }
  body.vc .panel { border-radius: var(--radius-lg); }
  body.vc #controls { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); margin: 0; padding: 10px 16px; gap: 10px; width: 430px; flex-wrap: wrap; justify-content: center; border-radius: 26px;
    background: var(--color-surface); border: var(--border-width) solid var(--color-border); box-shadow: var(--shadow-md); z-index: 3; pointer-events: auto; }
  body.vc #stepper { width: 384px; }
  body.vc .btn, body.vc .seg { border-width: 3px; }
  body.vc .btn { box-shadow: var(--shadow-press); font-weight: 800; padding: 7px 16px; }
  body.vc .btn:active { box-shadow: none; transform: translateY(2px); }
  body.vc #feed { bottom: auto; top: 76px; left: 12px; transform: none; width: 250px; }
  body.vc #tools { right: auto; left: 12px; top: 224px; flex-direction: row; }
  body.vc #detail { right: 12px; }
  body.vc .lbl { font-weight: 800; font-size: 12px; box-shadow: var(--shadow-press); }
  body.vc .bar { height: 10px; border: 2px solid var(--color-border); background: #f1dcb3; }
  body.vc .step .dot { border-width: 3px; }
  body.vc #stepper h4 { color: var(--color-primary); }
  body.vc .live { background: #dff0d4; border: 2px solid var(--color-border); }

  /* ---------- sketch toolbar (lives in the tab bar) ---------- */
  #sketch-tools { position: fixed; top: 0; right: 12px; height: 44px; z-index: 9999; font-family: system-ui, sans-serif; font-size: 12px; color: #666; display: flex; gap: 6px; align-items: center; }
  #sketch-tools button { background: #fafafa; color: #1a1a1a; border: 1px solid #d4d4d4; border-radius: 6px; padding: 3px 9px; font-size: 12px; }
  #sketch-tools button:hover { background: #eee; }
  #sketch-tools button.on { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }

  @media (max-width: 1100px) {
    #feed, #little { display: none; }
    #kpis .kpi:nth-child(n+3) { display: none; }
    .search { display: none; }
  }
  @media (max-width: 1000px) { #sketch-tools { display: none; } .live { display: none; } }
  @media (max-width: 800px) {
    #stepper { display: none; }
    #detail { width: 250px; }
    #lists { width: 280px; }
    .slider { display: none; }
  }
</style>
</head>
<body class="va">

<div id="variant-nav">
  <span class="ttl">Sketch 001 · factory scene style</span>
  <button class="variant-tab active" data-v="a">A: Light Digital Twin ★ Selected</button>
  <button class="variant-tab" data-v="b">B: Night Control Room</button>
  <button class="variant-tab" data-v="c">C: Pizza Kitchen Game</button>
</div>

<div id="stage">
  <canvas id="gl"></canvas>
  <div id="labels"></div>

  <div id="hud">
    <header id="topbar" class="panel">
      <div class="brand"><span class="logo">🍕</span><div><b>PizzaTrack</b><small>line pizza-1 · run-0001</small></div></div>
      <label class="search"><input id="search" placeholder="Search lots / stations…  ( / )" autocomplete="off"></label>
      <div id="controls">
        <div class="seg" id="rule" title="Dispatch rule"><button data-v="FIFO" class="on">FIFO</button><button data-v="SPT">SPT</button><button data-v="EDD">EDD</button></div>
        <div class="seg" id="speed" title="Simulation speed"><button data-v="0">⏸</button><button data-v="1">1×</button><button data-v="2" class="on">2×</button><button data-v="4">4×</button></div>
        <label class="slider">Arrival <input id="arr" type="range" min="3" max="12" step="0.5" value="6"><b id="arrv">6s</b></label>
        <button id="rush" class="btn primary">＋ Rush lot</button>
      </div>
      <div id="score">⭐ Lv <b id="lvl">1</b> · <b id="pts">0</b> pts</div>
      <div class="live"><i></i>Live <b id="clock">00:00</b></div>
    </header>

    <section id="kpis">
      <div class="kpi" id="k-thr"><div class="ic">📦</div><div><small>Throughput</small><b>0.0</b><em>pizzas/min</em></div></div>
      <div class="kpi" id="k-wip"><div class="ic">🧺</div><div><small>WIP</small><b>0</b><em>lots</em></div></div>
      <div class="kpi" id="k-ct"><div class="ic">⏱️</div><div><small>Cycle time</small><b>0.0</b><em>s / lot</em></div></div>
      <div class="kpi" id="k-bn"><div class="ic">🔥</div><div><small>Bottleneck</small><b>—</b><em></em></div></div>
    </section>
    <div id="little"></div>

    <section id="feed" class="panel"></section>
    <div id="tools" class="panel">
      <button id="zin" title="Zoom in">＋</button><button id="zout" title="Zoom out">－</button>
      <button id="rl" title="Rotate left">↺</button><button id="rr" title="Rotate right">↻</button><button id="home" title="Reset view">⌂</button>
    </div>
    <aside id="detail" class="panel"></aside>
    <section id="stepper" class="panel"></section>
    <section id="lists" class="panel">
      <div class="tabs"><button data-t="st" class="on">Stations</button><button data-t="lot">Lots</button><small id="lcount"></small></div>
      <div class="list" id="list"></div>
    </section>
    <div id="toast"></div>
  </div>
</div>

<div id="sketch-tools">
  <span>Viewport</span>
  <button data-w="375">375</button><button data-w="768">768</button><button data-w="100%" class="on">Full</button>
  <span style="margin-left:6px">Sim</span>
  <button id="reset">Reset</button>
</div>

<script src="../vendor/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const fmtT = t => { t = Math.max(0, t | 0); return String((t / 60) | 0).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); };

/* =====================================================================
   1. FAKE LINE SIMULATION  (stands in for Kafka station.events + KPI service)
   ===================================================================== */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const STN = [
  { id: 'dough',    name: 'Dough',    zh: '揉麵團', ic: '🌾', unit: 1.2 },
  { id: 'sauce',    name: 'Sauce',    zh: '抹醬',   ic: '🍅', unit: 1.0 },
  { id: 'cheese',   name: 'Cheese',   zh: '撒起司', ic: '🧀', unit: 1.0 },
  { id: 'toppings', name: 'Toppings', zh: '放配料', ic: '🫑', unit: 1.6 },
  { id: 'bake',     name: 'Bake',     zh: '烘烤',   ic: '🔥', unit: 2.6 },
  { id: 'slice',    name: 'Slice',    zh: '切片',   ic: '🔪', unit: 1.0 },
  { id: 'package',  name: 'Package',  zh: '包裝',   ic: '📦', unit: 1.4 },
];
const N = STN.length;
let rng, S;

function newSim() {
  rng = mulberry32(7);
  S = { t: 0, speed: 2, rule: 'FIFO', interval: 6, nextArr: 1.5, seq: 0, orders: new Map(), done: [], wip: [], feed: [], points: 0, sel: null,

const HOME = { a: { az: .3, tz: -2.5, tx: 3 }, b: { az: .3, tz: -2.5, tx: 3 }, c: { az: .22, tz: -1, tx: 2 } };
let V_KEY = 'a';
function applyTheme(k) {
  V_KEY = k; const T = THEME[k];
  scene.background = new THREE.Color(T.bg); scene.fog = new THREE.Fog(...T.fog);
  hemi.color.set(T.hemi[0]); hemi.groundColor.set(T.hemi[1]); hemi.intensity = T.hemi[2]; sun.color.set(T.sun[0]); sun.intensity = T.sun[1];
  M.ground.color.set(T.ground); M.dark.color.set(T.dark); M.body.color.set(T.body); M.canopy.color.set(T.canopy); M.truckCab.color.set(T.truckCab);
  beltTopMat.color.set(T.belt);
  stationAccent.forEach((m, i) => { const c = T.accent(i); m.color.set(c); m.emissive.set(T.emissive ? c : 0x000000); m.emissiveIntensity = T.emissive; });
  decorA.visible = k === 'a'; decorB.visible = k === 'b'; decorC.visible = k === 'c';
  ground.visible = true; hemi.visible = true;
  camera = T.ortho ? ortho : persp; cam.el = T.el; cam.azT = cam.az = T.az; cam.zoom = cam.zoomT = 1; cam.tz = cam.tzT = HOME[k].tz; cam.tx = cam.txT = HOME[k].tx;
  bracket.material.color.set(T.bracket);
  $('#theme-link').href = `../themes/${T.cssTheme}.css`;
  document.body.className = 'v' + k;
  resize(); placeCam();
}

/* ---- input ---- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let drag = null;
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('pointerdown', e => { canvas.setPointerCapture(e.pointerId); drag = { x: e.clientX, y: e.clientY, moved: 0, btn: e.button }; });
canvas.addEventListener('pointermove', e => {
  if (drag) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY; drag.moved += Math.abs(dx) + Math.abs(dy);
    if (drag.btn === 2) { cam.azT -= dx * .006; }
    else {
      const k = cam.VH / stage.clientHeight / cam.zoom, a = cam.az;
      cam.txT -= (Math.cos(a) * dx) * k; cam.tzT += (Math.sin(a) * dx) * k;
      cam.txT -= (Math.sin(a) * dy) * k / Math.sin(cam.el) * 1; cam.tzT -= (Math.cos(a) * dy) * k / Math.sin(cam.el) * 1;
      cam.txT = Math.max(-30, Math.min(30, cam.txT)); cam.tzT = Math.max(-14, Math.min(14, cam.tzT));
    }
    return;
  }
  const hit = pickAt(e); canvas.style.cursor = hit ? 'pointer' : 'grab';
  if (hit) { hoverBox.setFromObject(hit.obj); hoverHelper.visible = true; } else hoverHelper.visible = false;
});
canvas.addEventListener('pointerup', e => { const d = drag; drag = null; if (d && d.moved < 5 && d.btn === 0) { const hit = pickAt(e); select(hit ? hit.sel : null); } });
canvas.addEventListener('wheel', e => { e.preventDefault(); cam.zoomT = Math.max(.6, Math.min(3.2, cam.zoomT * Math.exp(-e.deltaY * .0012))); }, { passive: false });
function pickAt(e) {
  const r = canvas.getBoundingClientRect(); ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const objs = [...stationGroups, ...[...pizzas.values()].filter(p => p.life === 0).map(p => p.g)];
  const hits = ray.intersectObjects(objs, true);
  for (const h of hits) { let o = h.object; while (o && !o.userData.kind) o = o.parent; if (o) return { obj: o, sel: o.userData.kind === 'station' ? { t: 'st', i: o.userData.i } : { t: 'lot', id: o.userData.id } }; }
  return null;
}
function select(sel) { if (sel) hintOff = false; S.sel = sel; renderDetail(true); renderStepper(); renderList(); }
function selTarget() { if (!S.sel) return null; return S.sel.t === 'st' ? stationGroups[S.sel.i] : (pizzas.get(S.sel.id) || {}).g; }

/* =====================================================================
   3. HUD RENDERING
   ===================================================================== */
let toastT; function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1800); }
const stState = st => st.down ? 'down' : st.cur ? 'busy' : 'idle';
const chip = s => `<span class="chip ${s}">${{ down: 'Down', busy: 'Busy', idle: 'Idle' }[s]}</span>`;

function renderKpis() {
  const k = kpis();
  $('#k-thr b').textContent = k.thr.toFixed(1);
  $('#k-wip b').textContent = k.wipNow;
  $('#k-ct b').textContent = k.ct ? k.ct.toFixed(0) : '—';
  $('#k-bn b').textContent = k.bn.name; $('#k-bn em').textContent = Math.round(k.bn.ema * 100) + '% util';
  $('#k-bn').classList.toggle('alert', k.bn.q.length >= 4);
  const err = k.lw > 0 ? Math.abs(k.L - k.lw) / k.L : 0;
  $('#little').innerHTML = k.n < 3 ? `Little's Law · warming up…` : `Little's Law · L <b>${k.L.toFixed(1)}</b> vs λ·W <b>${k.lw.toFixed(1)}</b> <span class="${err < .15 ? 'ok' : 'bad'}">Δ ${Math.round(err * 100)}%</span>`;
  $('#clock').textContent = fmtT(S.t);
  const lvl = 1 + Math.floor(S.points / 100); $('#lvl').textContent = lvl; $('#pts').textContent = S.points;
  $('#feed').innerHTML = '<h5>station.events</h5>' + S.feed.map(f => `<div>${f}</div>`).join('');
}
let lastDetailKey = '', hintOff = false;
function renderDetail(force) {
  const el = $('#detail'); const sel = S.sel;
  if (!sel && hintOff) { el.style.display = 'none'; return; }
  el.style.display = '';
  if (!sel) { el.innerHTML = `<div class="hd"><div class="ic">🖱️</div><div><small>Inspector</small><b>Click a station or a lot</b></div><button class="x" data-a="close" title="Close">✕</button></div><p class="muted" style="font-size:.82rem;line-height:1.5">Drag to pan · right-drag or ↺ ↻ to rotate · wheel to zoom.<br>Break a station to watch WIP pile up in front of it.</p>`; return; }
  if (sel.t === 'st') {
    const st = S.stations[sel.i], s = stState(st), pct = st.cur ? Math.round((1 - st.remain / st.total) * 100) : 0;
    const key = 'st' + sel.i; const html = `
      <div class="hd"><div class="ic">${st.ic}</div><div><small>Station ${sel.i + 1} · ${st.zh}</small><b>${st.name}</b></div><button class="x" data-a="close">✕</button></div>
      ${chip(s)} <span class="chip">${st.unit.toFixed(1)}s / pizza</span>
      <div class="bar"><i style="width:${Math.round(st.ema * 100)}%"></i></div>
      <div class="rows">
        <div><span>Utilization (30s EMA)</span><span>${Math.round(st.ema * 100)}%</span></div>
        <div><span>Queue (WIP before)</span><span>${st.q.length} lots</span></div>
        <div><span>Current lot</span><span>${st.cur ? st.cur.id + ' · ' + pct + '%' : '—'}</span></div>
        <div><span>Processed</span><span>${st.done} lots</span></div>
        <div><span>Downtime</span><span>${st.downT.toFixed(0)} s</span></div>
      </div>
      <div class="acts"><button class="btn danger" data-a="break">${st.down ? 'Repair now' : '⚡ Break 12s'}</button><button class="btn" data-a="focus">Focus</button></div>`;
    if (force || html !== lastDetailKey) { el.innerHTML = html; lastDetailKey = html; }
  } else {
    const o = S.orders.get(sel.id); if (!o) { select(null); return; }
    const where = o.loc === 'out' ? 'Shipped' : o.loc === 'proc' ? 'In ' + S.stations[o.stage].name : 'Waiting for ' + S.stations[o.stage].name;
    const late = o.finished ? o.finished > o.due : S.t > o.due;
    const html = `
      <div class="hd"><div class="ic">🍕</div><div><small>${o.rush ? 'Rush lot' : 'Lot'}</small><b>${o.id} · ×${o.qty}</b></div><button class="x" data-a="close">✕</button></div>
      <span class="chip ${o.loc === 'out' ? 'busy' : o.loc === 'proc' ? 'busy' : 'warn'}">${where}</span> ${late ? '<span class="chip down">Late</span>' : ''}
      <div class="bar"><i style="width:${Math.round(o.stage / N * 100)}%"></i></div>
      <div class="rows">
        <div><span>Progress</span><span>${o.stage} / ${N} steps</span></div>
        <div><span>Age</span><span>${((o.finished ?? S.t) - o.born).toFixed(0)} s</span></div>
        <div><span>Due in</span><span>${(o.due - S.t).toFixed(0)} s</span></div>
        <div><span>Rule</span><span>${S.rule}</span></div>
      </div>
      <div class="acts"><button class="btn" data-a="follow">Follow</button></div>`;
    if (force || html !== lastDetailKey) { el.innerHTML = html; lastDetailKey = html; }
  }
}
$('#detail').addEventListener('click', e => {
  const a = e.target.closest('[data-a]'); if (!a || !S.sel) return;
  if (a.dataset.a === 'close') { hintOff = true; select(null); }
  if (a.dataset.a === 'break') { const st = S.stations[S.sel.i]; st.down ? repair(st) : breakStation(st); renderDetail(true); }
  if (a.dataset.a === 'focus') { cam.txT = stX(S.sel.i); cam.zoomT = 1.8; cam.tzT = 0; }
  if (a.dataset.a === 'follow') { const pz = pizzas.get(S.sel.id); if (pz) { cam.txT = pz.g.position.x; cam.tzT = 0; cam.zoomT = 2; } }
});

function stepperLot() {
  const sel = S.sel; if (sel && sel.t === 'lot') return S.orders.get(sel.id);
  if (sel && sel.t === 'st' && S.stations[sel.i].cur) return S.stations[sel.i].cur;
  let best = null; for (const o of S.orders.values()) if (o.loc !== 'out' && (!best || o.stage > best.stage)) best = o; return best;
}
function renderStepper() {
  const o = stepperLot(); const el = $('#stepper');
  if (!o) { el.innerHTML = '<h4>Lot tracking</h4><p class="muted" style="font-size:.8rem">No lots in the system yet.</p>'; return; }
  el.innerHTML = `<h4>🍕 Lot tracking <small>${o.id} · ×${o.qty} · ${o.loc === 'out' ? 'shipped' : 'in line'}</small></h4><div class="steps">` +
    STN.map((s, i) => { const cls = i < o.stage ? 'done' : (i === o.stage && o.loc !== 'out') ? 'active' : ''; return `<div class="step ${cls}"><div class="dot">${i < o.stage ? '✓' : s.ic}</div><b>${s.name}</b><i>${o.times[i] != null ? fmtT(o.times[i]) : '—'}</i></div>`; }).join('') + '</div>';
}
let tab = 'st', q = '';
function renderList() {
  const el = $('#list');
  if (tab === 'st') {
    el.innerHTML = S.stations.map(st => { const s = stState(st); return `<div class="row ${S.sel && S.sel.t === 'st' && S.sel.i === st.i ? 'sel' : ''}" data-st="${st.i}"><b>${st.name}</b><div class="mid"><div class="bar"><i style="width:${Math.round(st.ema * 100)}%"></i></div>${st.q.length}q</div>${chip(s)}</div>`; }).join('');
    $('#lcount').textContent = '7 stations';
  } else {
    let arr = [...S.orders.values()].filter(o => o.loc !== 'out' && (!q || o.id.toLowerCase().includes(q))).sort((a, b) => b.stage - a.stage).slice(0, 40);
    $('#lcount').textContent = arr.length + ' in WIP';
    el.innerHTML = arr.length ? arr.map(o => `<div class="row ${S.sel && S.sel.t === 'lot' && S.sel.id === o.id ? 'sel' : ''}" data-lot="${o.id}"><b>${o.id}${o.rush ? ' ⚡' : ''}</b><div class="mid"><div class="bar"><i style="width:${Math.round(o.stage / N * 100)}%"></i></div>×${o.qty}</div><span class="chip ${o.loc === 'proc' ? 'busy' : 'warn'}">${S.stations[o.stage].name}</span></div>`).join('') : '<div class="empty">No matching lots</div>';
  }
}
$('#list').addEventListener('click', e => { const r = e.target.closest('.row'); if (!r) return; if (r.dataset.st != null) select({ t: 'st', i: +r.dataset.st }); else select({ t: 'lot', id: r.dataset.lot }); });
$$('.tabs button').forEach(b => b.onclick = () => { tab = b.dataset.t; $$('.tabs button').forEach(x => x.classList.toggle('on', x === b)); renderList(); });
$('#search').addEventListener('input', e => { q = e.target.value.trim().toLowerCase(); if (q) { tab = 'lot'; $$('.tabs button').forEach(x => x.classList.toggle('on', x.dataset.t === 'lot')); } renderList(); });
$('#search').addEventListener('keydown', e => { if (e.key === 'Enter') { const o = [...S.orders.values()].find(o => o.id.toLowerCase().includes(q)); if (o) select({ t: 'lot', id: o.id }); const st = S.stations.find(s => s.id.includes(q)); if (!o && st) select({ t: 'st', i: st.i }); } });
addEventListener('keydown', e => { if (e.key === '/' && document.activeElement.id !== 'search') { e.preventDefault(); $('#search').focus(); } });

/* controls */
const seg = (id, cb) => $$('#' + id + ' button').forEach(b => b.onclick = () => { $$('#' + id + ' button').forEach(x => x.classList.toggle('on', x === b)); cb(b.dataset.v); });
seg('rule', v => { S.rule = v; toast('Dispatch rule: ' + v); });
seg('speed', v => { S.speed = +v; });
$('#arr').oninput = e => { S.interval = +e.target.value; $('#arrv').textContent = S.interval + 's'; };
$('#rush').onclick = () => { const o = spawn(true); toast('Rush lot ' + o.id + ' added'); };
$('#zin').onclick = () => cam.zoomT = Math.min(3.2, cam.zoomT * 1.25); $('#zout').onclick = () => cam.zoomT = Math.max(.6, cam.zoomT / 1.25);
$('#rl').onclick = () => cam.azT += Math.PI / 4; $('#rr').onclick = () => cam.azT -= Math.PI / 4; $('#home').onclick = homeView;
$$('.variant-tab').forEach(b => b.onclick = () => { $$('.variant-tab').forEach(x => x.classList.toggle('active', x === b)); applyTheme(b.dataset.v); });
$$('#sketch-tools [data-w]').forEach(b => b.onclick = () => { $$('#sketch-tools [data-w]').forEach(x => x.classList.toggle('on', x === b)); stage.style.width = b.dataset.w; resize(); });
$('#reset').onclick = () => boot();

/* =====================================================================
   4. MAIN LOOP
   ===================================================================== */
const tmpV = new THREE.Vector3(), clock = new THREE.Clock();
let hudAcc = 0, tAnim = 0;
function frame() {
  requestAnimationFrame(frame);
  const rdt = Math.min(clock.getDelta(), .1); tAnim += rdt;
  if (S.speed > 0) { let rem = rdt * S.speed; while (rem > 0) { const d = Math.min(rem, .1); step(d); rem -= d; } }
  const T = THEME[V_KEY];
  // targets for pizzas
  S.stations.forEach(st => {
    st.q.forEach((o, k) => { const p = pizzas.get(o.id); if (p) p.tgt.copy(slot(st.i, k)); });
    if (st.cur) { const p = pizzas.get(st.cur.id); if (p) p.tgt.set(stX(st.i), BELT_Y + .02, 0); }
  });
  const kk = 1 - Math.exp(-rdt * 7 * Math.max(1, S.speed * .6));
  for (const [id, pz] of pizzas) {
    const o = pz.o;
    if (o.loc === 'out') { pz.tgt.set(TRUCK_X + 1.4, 1.0, 0); }
    skinPizza(pz);
    pz.g.position.lerp(pz.tgt, kk);
    if (o.loc === 'out') { pz.life += rdt * 2; if (pz.life > 1.9) { pz.g.scale.multiplyScalar(.82); if (pz.g.scale.x < .05) { scene.remove(pz.g); pizzas.delete(id); if (S.sel && S.sel.id === id) select(null); } } }
  }
  // stations animation
  S.stations.forEach(st => {
    const s = stState(st), lm = lightMats[st.i];
    const col = s === 'busy' ? T.light[0] : s === 'down' ? T.light[2] : T.light[1];
    lm.color.set(col); lm.emissive.set(s === 'idle' ? 0x000000 : col); lm.emissiveIntensity = s === 'down' ? (Math.sin(tAnim * 9) > 0 ? 1.4 : .2) : 1;
    const pb = progBars[st.i]; const f = st.cur ? 1 - st.remain / st.total : 0; pb.scale.x = Math.max(.001, 1.8 * f); pb.position.x = -.9 + .9 * f;
  });
  spinners.forEach(sp => { const st = S.stations[sp.i]; if (st.cur && !st.down) sp.o.rotation.y += sp.sp * rdt; });
  const bake = S.stations[4]; const on = bake.cur && !bake.down;
  glowers[0].material.emissive.set(on ? 0xff7a1a : 0x1a0a00); glowers[0].material.emissiveIntensity = on ? 1.1 + Math.sin(tAnim * 8) * .25 : .1; glowers[1].intensity = on ? 1.6 : 0;
  beltTex.offset.x -= rdt * .12 * S.speed;
  // camera
  cam.az += (cam.azT - cam.az) * .12; cam.zoom += (cam.zoomT - cam.zoom) * .14; cam.tx += (cam.txT - cam.tx) * .14; cam.tz += (cam.tzT - cam.tz) * .14;
  placeCam();
  // selection bracket
  const tg = selTarget(); if (tg) { box3.setFromObject(tg); bracket.visible = true; } else bracket.visible = false;
  // labels
  const w = stage.clientWidth, h = stage.clientHeight;
  stationGroups.forEach((g, i) => {
    tmpV.set(stX(i), 3.5, -1.9).project(camera); const el = lbl[i], st = S.stations[i];
    el.style.left = ((tmpV.x * .5 + .5) * w).toFixed(1) + 'px'; el.style.top = ((-tmpV.y * .5 + .5) * h).toFixed(1) + 'px';
    el.className = 'lbl ' + stState(st) + (S.sel && S.sel.t === 'st' && S.sel.i === i ? ' sel' : '') + (st.q.length >= 4 ? ' hot' : '');
    const q = el.querySelector('.q'); q.textContent = st.q.length; q.classList.toggle('zero', st.q.length === 0);
  });
  // hud @ 5Hz
  hudAcc += rdt; if (hudAcc > .2) { hudAcc = 0; renderKpis(); renderDetail(false); renderStepper(); renderList(); }
  renderer.render(scene, camera);
}

/* ---- boot ---- */
let started = false;
function boot() {
  for (const pz of pizzas.values()) scene.remove(pz.g); pizzas.clear();
  const speed = S ? S.speed : 2, rule = S ? S.rule : 'FIFO', interval = S ? S.interval : 6;
  newSim(); S.speed = speed; S.rule = rule; S.interval = interval;
  for (let i = 0; i < 1200; i++) step(.1);                         // warm-up: 120 simulated seconds
  for (const [, pz] of pizzas) { /* snap */ }
  S.stations.forEach(st => { st.q.forEach((o, k) => { const p = pizzas.get(o.id); if (p) p.g.position.copy(slot(st.i, k)); }); if (st.cur) { const p = pizzas.get(st.cur.id); if (p) p.g.position.set(stX(st.i), BELT_Y + .02, 0); } });
  for (const [id, pz] of pizzas) if (pz.o.loc === 'out') { scene.remove(pz.g); pizzas.delete(id); }
  S.feed = []; select({ t: 'st', i: 4 });
  if (!started) { started = true; applyTheme('a'); frame(); }
}
boot();
window.__sk = { S: () => S, applyTheme, select, breakStation,
  // debug helper: screen position (page px) of a station's machine, for click tests
  proj: i => { const v = new THREE.Vector3(stX(i), 1.5, -1.9).project(camera), r = canvas.getBoundingClientRect(); return [r.left + (v.x * .5 + .5) * r.width, r.top + (-v.y * .5 + .5) * r.height]; } };
})();
</script>
